<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Image Gallery</h1>
        <p>Explore beautiful moments</p>
    </header>

    <!-- Category Filters -->
    <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="nature">Nature</button>
        <button class="filter-btn" data-filter="city">City</button>
        <button class="filter-btn" data-filter="animals">Animals</button>
    </div>

    <!-- Gallery -->
    <main class="gallery">

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
                 alt="Mountain landscape">
            <div class="overlay">Mountain</div>
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df"
                 alt="City skyline">
            <div class="overlay">City</div>
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://images.unsplash.com/photo-1552053831-71594a27632d"
                 alt="Golden retriever">
            <div class="overlay">Dog</div>
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
                 alt="Beautiful lake">
            <div class="overlay">Lake</div>
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000"
                 alt="City street">
            <div class="overlay">Street</div>
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://images.unsplash.com/photo-1546182990-dffeafbe841d"
                 alt="Lion">
            <div class="overlay">Lion</div>
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e"
                 alt="Forest landscape">
            <div class="overlay">Forest</div>
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://images.unsplash.com/photo-1496568816309-51d7c20e3b21"
                 alt="Modern buildings">
            <div class="overlay">Buildings</div>
        </div>

    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">

        <button class="close" id="close">&times;</button>

        <button class="prev" id="prev">&#10094;</button>

        <img id="lightbox-img" src="" alt="">

        <button class="next" id="next">&#10095;</button>

    </div>

    <script src="script.js"></script>
</body>
</html>
